<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AyudaYa — Crear reporte</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0284c7">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="AyudaYa">
    <link rel="apple-touch-icon" href="assets/images/icon-192.png">
    <link rel="stylesheet" href="css/styles.css">
    <script>
        (function () {
            try {
                if (localStorage.getItem('ayudaya_theme') === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <nav class="navbar" aria-label="Navegación principal">
        <a href="login.html" class="navbar__item">
            <svg class="navbar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></svg>
            <span>Login</span>
        </a>
        <a href="index.html" class="navbar__item">
            <svg class="navbar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
            <span>Inicio</span>
        </a>
        <a href="reportes.html" class="navbar__item">
            <svg class="navbar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
            <span>Reportes</span>
        </a>
        <a href="crear-reporte.html" class="navbar__item navbar__item--active" aria-current="page">
            <svg class="navbar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8.5v7M8.5 12h7"/></svg>
            <span>Crear</span>
        </a>
        <button type="button" class="navbar__item navbar__item--button" id="themeToggle" aria-pressed="false">
            <svg class="navbar__icon" id="themeToggleIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
            <span>Tema</span>
        </button>
    </nav>

    <main class="screen">
        <h1 class="screen__title">Nuevo reporte</h1>
        <p class="screen__subtitle">Describe la necesidad comunitaria. Mientras más datos, más fácil será resolverla.</p>

        <form id="createReportForm" class="form--narrow" novalidate>
            <div class="form__group">
                <label class="form__label" for="report-title">Título</label>
                <input class="form__input" id="report-title" type="text" placeholder="Ej: Bache en la calle principal" required>
                <span class="form__error" id="report-title-error"></span>
            </div>

            <div class="form__group">
                <label class="form__label" for="report-category">Categoría</label>
                <select class="form__input form__select" id="report-category" required>
                    <option value="">Selecciona una categoría</option>
                    <option value="bache">Bache</option>
                    <option value="alumbrado">Alumbrado</option>
                    <option value="inseguridad">Inseguridad</option>
                    <option value="convivencia">Convivencia vecinal</option>
                </select>
                <span class="form__error" id="report-category-error"></span>
            </div>

            <div class="form__group">
                <label class="form__label" for="report-description">Descripción</label>
                <textarea class="form__input form__textarea" id="report-description" placeholder="Detalles del problema, cuándo ocurre, a quiénes afecta..." required></textarea>
                <span class="form__error" id="report-description-error"></span>
            </div>

            <div class="form__group">
                <label class="form__label" for="report-photo">Foto</label>
                <label class="placeholder-visual" for="report-photo" id="reportPhotoLabel" aria-label="Agregar foto del reporte">
                    <svg class="placeholder-visual__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5h3.2L8 6h8l1.8 2.5H21a1 1 0 0 1 1 1v8.5a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V9.5a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>
                    <span>Toca para agregar una foto</span>
                </label>
                <input class="sr-only" id="report-photo" type="file" accept="image/*">
                <span class="form__error" id="report-photo-error"></span>
            </div>

            <div class="form__group">
                <label class="form__label" for="report-location">Ubicación</label>
                <div class="location-row">
                    <input class="form__input" id="report-location" type="text" placeholder="Ej: Sector Bastión Popular, Mz. 4">
                    <button class="btn btn--secondary btn--icon" type="button" id="useLocationBtn" aria-label="Usar mi ubicación actual" title="Usar mi ubicación actual">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.6 7-11a7 7 0 1 0-14 0c0 4.4 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
                    </button>
                </div>
                <span class="location-status" id="report-location-status"></span>
                <span class="form__error" id="report-map-error"></span>
            </div>

            <button class="btn btn--primary btn--block" type="submit">Enviar reporte</button>
        </form>
    </main>
    <script src="js/main.js"></script>
</body>
</html>
