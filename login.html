<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AyudaYa — Iniciar sesión</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0284c7">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="AyudaYa">
    <link rel="apple-touch-icon" href="assets/images/icon-192.png">
    <link rel="stylesheet" href="css/styles.css">
    <script>
        (function () {
            try {
                if (localStorage.getItem('ayudaya_theme') === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <nav class="navbar" aria-label="Navegación principal">
        <a href="login.html" class="navbar__item">
            <svg class="navbar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></svg>
            <span>Login</span>
        </a>
        <a href="index.html" class="navbar__item">
            <svg class="navbar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
            <span>Inicio</span>
        </a>
        <a href="reportes.html" class="navbar__item">
            <svg class="navbar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
            <span>Reportes</span>
        </a>
        <a href="crear-reporte.html" class="navbar__item">
            <svg class="navbar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8.5v7M8.5 12h7"/></svg>
            <span>Crear</span>
        </a>
        <button type="button" class="navbar__item navbar__item--button" id="themeToggle" aria-pressed="false">
            <svg class="navbar__icon" id="themeToggleIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
            <span>Tema</span>
        </button>
    </nav>

    <div class="screen screen--centered">
        <div class="auth-card">
            <div class="auth-card__brand">
                <img src="assets/images/logo-ayudaya.svg" alt="AyudaYa" class="auth-card__logo">
                <div class="screen__logo auth-card__badge">AyudaYa</div>
            </div>
            <h1 class="screen__title">Iniciar sesión</h1>
            <p class="screen__subtitle">Reporta y gestiona necesidades de tu comunidad.</p>

            <form id="loginForm" novalidate>
            <div class="form__group">
                <label class="form__label" for="login-user">Usuario</label>
                <input class="form__input" id="login-user" type="text" autocomplete="username" required>
                <span class="form__error" id="login-user-error"></span>
            </div>
            <div class="form__group">
                <label class="form__label" for="login-pass">Contraseña</label>
                <input class="form__input" id="login-pass" type="password" autocomplete="current-password" required>
                <span class="form__error" id="login-pass-error"></span>
            </div>
            <button class="btn btn--primary btn--block mt-sm" type="submit">Ingresar</button>
        </form>

        <div class="mt-md">
            <a href="registro.html" class="link">Crear cuenta</a>
        </div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
