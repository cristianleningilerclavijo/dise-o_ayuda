<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AyudaYa — Crear cuenta</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0284c7">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="AyudaYa">
    <link rel="apple-touch-icon" href="assets/images/icon-192.png">
    <link rel="stylesheet" href="css/styles.css">
    <script>
        (function () {
            try {
                if (localStorage.getItem('ayudaya_theme') === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <nav class="navbar" aria-label="Navegación principal">
        <a href="login.html" class="navbar__item navbar__item--active" aria-current="page">
            <span class="navbar__icon" aria-hidden="true">👤</span>
            <span>Login</span>
        </a>
        <a href="index.html" class="navbar__item">
            <span class="navbar__icon" aria-hidden="true">🏠</span>
            <span>Inicio</span>
        </a>
        <a href="reportes.html" class="navbar__item">
            <span class="navbar__icon" aria-hidden="true">📋</span>
            <span>Reportes</span>
        </a>
        <a href="crear-reporte.html" class="navbar__item">
            <span class="navbar__icon" aria-hidden="true">➕</span>
            <span>Crear</span>
        </a>
        <button type="button" class="navbar__item navbar__item--button" id="themeToggle" aria-pressed="false">
            <span class="navbar__icon" id="themeToggleIcon" aria-hidden="true">🌙</span>
            <span>Tema</span>
        </button>
    </nav>

    <main class="screen">
        <div class="auth-card auth-card--wide">
            <div class="auth-card__brand">
                <img src="assets/images/logo-ayudaya.svg" alt="AyudaYa" class="auth-card__logo auth-card__logo--sm">
                <h1 class="auth-card__title">Crear cuenta</h1>
            </div>
            <p class="auth-card__lead">
                Unite a la comunidad. Con tu cuenta podrás reportar necesidades y hacer seguimiento de las gestiones.
            </p>

            <form id="registerForm" novalidate>
                <div class="form__group">
                    <label class="form__label" for="reg-name">Nombre completo</label>
                    <input class="form__input" id="reg-name" type="text" autocomplete="name" placeholder="Ej: María González" required>
                    <span class="form__error" id="reg-name-error"></span>
                </div>

                <div class="form__group">
                    <label class="form__label" for="reg-user">Usuario</label>
                    <input class="form__input" id="reg-user" type="text" autocomplete="username" placeholder="Ej: maria_g" required>
                    <span class="form__error" id="reg-user-error"></span>
                </div>

                <div class="form__group">
                    <label class="form__label" for="reg-email">Correo electrónico</label>
                    <input class="form__input" id="reg-email" type="email" autocomplete="email" placeholder="nombre@correo.com" required>
                    <span class="form__error" id="reg-email-error"></span>
                </div>

                <div class="form__group">
                    <label class="form__label" for="reg-pass">Contraseña</label>
                    <input class="form__input" id="reg-pass" type="password" autocomplete="new-password" required>
                    <span class="form__error" id="reg-pass-error"></span>
                </div>

                <div class="form__group">
                    <label class="form__label" for="reg-pass-confirm">Confirmar contraseña</label>
                    <input class="form__input" id="reg-pass-confirm" type="password" autocomplete="new-password" required>
                    <span class="form__error" id="reg-pass-confirm-error"></span>
                </div>

                <button class="btn btn--primary btn--block" type="submit">REGISTRARSE</button>
            </form>

            <div class="mt-md text-center">
                <a href="login.html" class="link">Ya tengo cuenta · Iniciar sesión</a>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
